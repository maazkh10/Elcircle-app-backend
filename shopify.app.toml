# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "84852d13a0aaab26593e8f1da171e21d"
name = "loyalty-points-app-test"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = ["orders/paid"]
uri = "/api/webhooks/orders-create"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_discounts,write_products,write_draft_orders,read_customers,read_orders,write_store_credit_account_transactions"
[app_proxy]
url = "/api/membership"
prefix = "apps"
subpath = "elcircle-membership"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]
